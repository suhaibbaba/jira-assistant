name: triage
description: A native Mac & Windows app for triaging Jira tickets by status and priority.
publish_to: 'none'
version: 1.6.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0                      # Jira REST API calls
  flutter_secure_storage: ^9.2.2   # Keychain (Mac) / Credential Locker (Windows)
  shared_preferences: ^2.2.3       # Settings, attention items, time logs, cache
  url_launcher: ^6.2.6             # Open tickets in the browser
  intl: ^0.20.2                    # Date / business-day math (pinned by flutter_localizations)
  provider: ^6.1.2                 # State management

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.7                    # Windows installer (.msix)

flutter:
  uses-material-design: true
  generate: true

msix_config:
  # display_name must match AppInfo.appNameFull (lib/config/app_info.dart) —
  # yaml can't reference Dart constants, so keep them in sync by hand.
  display_name: Xngage - Jira Assistance
  publisher_display_name: Xngage - Jira Assistance
  identity_name: com.triage.app
  msix_version: 1.3.0.0
  capabilities: internetClient
  install_certificate: false
